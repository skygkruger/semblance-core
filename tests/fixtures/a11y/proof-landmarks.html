<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Proof Center — Semblance</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to proof center</a>
  <header role="banner">
    <h1>Proof Center</h1>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#chat">Chat</a></li>
        <li><a href="#proof" aria-current="page">Proof</a></li>
        <li><a href="#settings">Settings</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" role="main" aria-label="Proof Center">
    <section aria-labelledby="proof-heading">
      <h2 id="proof-heading">Attestations and receipts</h2>
      <table>
        <caption>Recent proof events</caption>
        <thead>
          <tr>
            <th scope="col">Event</th>
            <th scope="col">Status</th>
            <th scope="col">Time</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Action attestation</td>
            <td>Verified</td>
            <td><time datetime="2026-07-19T12:00:00Z">Jul 19, 2026</time></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
