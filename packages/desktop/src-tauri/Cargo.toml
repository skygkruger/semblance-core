[package]
name = "semblance-desktop"
version = "0.1.0"
description = "Semblance Desktop — Your Intelligence. Your Device. Your Rules."
authors = ["Veridian Synthetics"]
license = "MIT"
edition = "2021"

[lib]
name = "semblance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
llama-cpp-2 = { version = "0.1.141", features = ["mtmd"] }
url = "2"
keyring = "3"
sha2 = "0.10"
