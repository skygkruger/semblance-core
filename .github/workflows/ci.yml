name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: skygkruger/semblence-representative
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: representative
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: skygkruger/semblance-run
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: website
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Verify release truth baseline
        run: >-
          node scripts/release-manifest.js --verify-source
          --core-repo "$GITHUB_WORKSPACE"
          --representative-repo "$GITHUB_WORKSPACE/representative"
          --website-repo "$GITHUB_WORKSPACE/website"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Exclude startup-smoke (needs bundled sidecar + model files, macOS only)
      - run: pnpm exec vitest run --exclude '**/startup-smoke*'

  privacy-audit:
    name: Privacy Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/privacy-audit/index.js

  integration-lite:
    name: Integration — Bracket Event Wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:bracket
